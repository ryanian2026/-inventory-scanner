<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory Scanner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#14171A;
    --panel:#1D2125;
    --panel-border:#2B3036;
    --text:#EDEBE6;
    --muted:#8B929B;
    --accent:#F5B400;
    --accent-ink:#1A1500;
    --success:#35A667;
    --danger:#D8503A;
    --sans:'Inter',system-ui,sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .barcode-rule{
    height:7px;
    background:repeating-linear-gradient(90deg,
      rgba(245,180,0,.55) 0 2px, transparent 2px 4px,
      rgba(245,180,0,.55) 4px 5px, transparent 5px 9px,
      rgba(245,180,0,.55) 9px 12px, transparent 12px 15px);
    opacity:.5;
    flex-shrink:0;
  }
  header{
    padding:18px 20px 14px;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  header p{
    margin:3px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 6px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px 14px 6px;
    margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input[type=date],
  .field input[type=text]{
    width:100%;
    background:#12151A;
    border:1px solid var(--panel-border);
    border-radius:7px;
    padding:11px 12px;
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .client-row{display:flex;gap:8px;}
  .client-row input{flex:1;}
  .btn-existing{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text);
    border-radius:7px;
    padding:0 14px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
  }
  .btn-existing:active{background:#282C31;}
  .locked-note{font-size:12px;color:var(--muted);margin:2px 0 10px;}

  #reader{width:100%;border-radius:8px;overflow:hidden;background:#000;}
  #reader video{border-radius:8px;}

  .scan-panel{display:none;}
  .scan-panel.active{display:block;}

  .count-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:14px 0 8px;
  }
  .count-row .n{font-family:var(--mono);font-size:26px;font-weight:600;}
  .count-row .label{font-size:12px;color:var(--muted);}

  .scan-list{list-style:none;margin:0;padding:0;}
  .scan-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 2px;
    border-bottom:1px solid var(--panel-border);
    font-family:var(--mono);
    font-size:13px;
  }
  .scan-list li:first-child{
    border-left:2px solid var(--accent);
    padding-left:8px;
    animation:pop .3s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .scan-list .code{color:var(--text);word-break:break-all;padding-right:10px;}
  .scan-list .meta{color:var(--muted);font-size:11px;flex-shrink:0;text-align:right;}
  .scan-list .meta .pending{color:var(--accent);}

  .empty-hint{color:var(--muted);font-size:13px;padding:10px 2px;}

  footer{
    flex-shrink:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--panel-border);
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:9px;
    padding:15px 10px;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    text-align:center;
  }
  .btn-start{background:var(--accent);color:var(--accent-ink);}
  .btn-start:active{background:#DDA400;}
  .btn-done{background:var(--success);color:#08170E;}
  .btn-done:active{background:#2C8B58;}
  .btn-new{background:transparent;border:1px solid var(--panel-border);color:var(--text);}
  .btn-new:active{background:#282C31;}
  .btn[disabled]{opacity:.4;}

  .status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    padding:0 2px 4px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .dot.ok{background:var(--success);}
  .dot.busy{background:var(--accent);animation:blink 1s infinite;}
  .dot.err{background:var(--danger);}
  @keyframes blink{50%{opacity:.3;}}

  .warn{
    background:rgba(216,80,58,.12);
    border:1px solid rgba(216,80,58,.4);
    color:#F0A390;
    font-size:13px;
    padding:9px 11px;
    border-radius:7px;
    margin-bottom:12px;
  }

  /* modal */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;z-index:20;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--panel);
    border-top:1px solid var(--panel-border);
    border-radius:14px 14px 0 0;
    width:100%;
    max-height:65vh;
    display:flex;
    flex-direction:column;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet h2{margin:0 0 10px;font-size:15px;}
  .sheet-list{overflow-y:auto;list-style:none;margin:0;padding:0;}
  .sheet-list li{
    padding:13px 4px;
    border-bottom:1px solid var(--panel-border);
    font-size:15px;
  }
  .sheet-list li:active{background:#282C31;}
  .sheet-close{
    margin-top:10px;
    background:transparent;border:1px solid var(--panel-border);
    color:var(--muted);border-radius:8px;padding:11px;font-family:var(--sans);
  }
</style>
</head>
<body>

<header>
  <h1>Inventory Scanner</h1>
  <p>Hardware stock &middot; barcode capture</p>
</header>
<div class="barcode-rule"></div>

<main>

  <div class="card" id="sessionCard">
    <div class="field">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">
    </div>
    <div class="field">
      <label for="clientInput">Client name</label>
      <div class="client-row">
        <input type="text" id="clientInput" placeholder="Type or select existing">
        <button class="btn-existing" id="selectExistingBtn" type="button">Select existing</button>
      </div>
    </div>
    <div class="field">
      <label for="locationInput">Location</label>
      <input type="text" id="locationInput" placeholder="e.g. Warehouse 2, Aisle B">
    </div>
    <div class="field">
      <label for="deviceInput">Device</label>
      <input type="text" id="deviceInput" placeholder="e.g. POS Terminal, Printer">
    </div>
  </div>

  <div id="validationWarn" class="warn" style="display:none;">Fill in date, client and location before scanning.</div>

  <div class="card scan-panel" id="scanPanel">
    <div id="reader"></div>
    <div class="count-row">
      <div>
        <div class="n" id="scanCount">0</div>
        <div class="label">items this session</div>
      </div>
      <div class="status" id="statusRow">
        <span class="dot ok" id="statusDot"></span>
        <span id="statusText">Synced</span>
      </div>
    </div>
    <ul class="scan-list" id="scanList"></ul>
    <div class="empty-hint" id="emptyHint">Point the camera at a barcode.</div>
  </div>

</main>

<footer>
  <button class="btn btn-new" id="newEntryBtn" type="button">New Entry</button>
  <button class="btn btn-start" id="startBtn" type="button">Start Scan</button>
  <button class="btn btn-done" id="doneBtn" type="button" style="display:none;">Done</button>
</footer>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2>Select existing client</h2>
    <ul class="sheet-list" id="clientSheetList"></ul>
    <button class="sheet-close" id="sheetCloseBtn" type="button">Cancel</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — paste your deployed Apps Script Web App URL here
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwNwuoaJNyCtz-tJt6wZvA1qha3ayggbK68YIK_0QHVplJtikBs4FjJzJgsZrpnizq1DQ/exec";

/* ---------------- state ---------------- */
let html5QrCode = null;
let scanning = false;
let sessionScans = [];      // {barcode, time, synced}
let lastCode = null;
let lastCodeAt = 0;
const COOLDOWN_MS = 1200;

const dateInput = document.getElementById('dateInput');
const clientInput = document.getElementById('clientInput');
const locationInput = document.getElementById('locationInput');
const deviceInput = document.getElementById('deviceInput');
const startBtn = document.getElementById('startBtn');
const doneBtn = document.getElementById('doneBtn');
const newEntryBtn = document.getElementById('newEntryBtn');
const scanPanel = document.getElementById('scanPanel');
const scanList = document.getElementById('scanList');
const scanCount = document.getElementById('scanCount');
const emptyHint = document.getElementById('emptyHint');
const validationWarn = document.getElementById('validationWarn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const selectExistingBtn = document.getElementById('selectExistingBtn');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const clientSheetList = document.getElementById('clientSheetList');
const sheetCloseBtn = document.getElementById('sheetCloseBtn');

// default date = today
dateInput.value = new Date().toISOString().slice(0,10);

/* ---------------- offline queue ---------------- */
const QUEUE_KEY = 'scanner_pending_queue';
function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ return []; } }
function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

function setStatus(state, text){
  statusDot.className = 'dot ' + state;
  statusText.textContent = text;
}

async function sendRow(row){
  // text/plain avoids a CORS preflight against Apps Script
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error('bad response');
  return res.json();
}

async function flushQueue(){
  let q = getQueue();
  if(q.length === 0) return;
  setStatus('busy','Syncing ' + q.length + '…');
  const remaining = [];
  for(const row of q){
    try{
      await sendRow(row);
    }catch(e){
      remaining.push(row);
    }
  }
  setQueue(remaining);
  if(remaining.length === 0){
    setStatus('ok','Synced');
    sessionScans.forEach(s => s.synced = true);
    renderScanList();
  } else {
    setStatus('err', remaining.length + ' pending');
  }
}

window.addEventListener('online', flushQueue);
setInterval(flushQueue, 8000);

/* ---------------- client picker ---------------- */
async function loadClients(){
  clientSheetList.innerHTML = '<li style="color:var(--muted)">Loading…</li>';
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    clientSheetList.innerHTML = '<li style="color:var(--muted)">Connect the Apps Script URL first.</li>';
    return;
  }
  try{
    const res = await fetch(API_URL + '?action=clients');
    const data = await res.json();
    const clients = data.clients || [];
    if(clients.length === 0){
      clientSheetList.innerHTML = '<li style="color:var(--muted)">No saved clients yet.</li>';
      return;
    }
    clientSheetList.innerHTML = '';
    clients.forEach(name => {
      const li = document.createElement('li');
      li.textContent = name;
      li.addEventListener('click', () => {
        clientInput.value = name;
        closeSheet();
      });
      clientSheetList.appendChild(li);
    });
  }catch(e){
    clientSheetList.innerHTML = '<li style="color:var(--muted)">Could not load clients. Check connection.</li>';
  }
}
function openSheet(){ sheetBackdrop.classList.add('open'); loadClients(); }
function closeSheet(){ sheetBackdrop.classList.remove('open'); }
selectExistingBtn.addEventListener('click', openSheet);
sheetCloseBtn.addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', e => { if(e.target === sheetBackdrop) closeSheet(); });

/* ---------------- scan list render ---------------- */
function renderScanList(){
  scanCount.textContent = sessionScans.length;
  emptyHint.style.display = sessionScans.length ? 'none' : 'block';
  scanList.innerHTML = '';
  sessionScans.slice().reverse().forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="code">${escapeHtml(s.barcode)}</span>
      <span class="meta">${s.time}${s.synced ? '' : ' <span class="pending">&middot; pending</span>'}</span>`;
    scanList.appendChild(li);
  });
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- scanning ---------------- */
function sessionValid(){
  return dateInput.value && clientInput.value.trim() && locationInput.value.trim() && deviceInput.value.trim();
}

async function onScanSuccess(decodedText){
  const now = Date.now();
  if(decodedText === lastCode && (now - lastCodeAt) < COOLDOWN_MS) return;
  lastCode = decodedText;
  lastCodeAt = now;

  if(navigator.vibrate) navigator.vibrate(60);
  beep();

  const row = {
    date: dateInput.value,
    client: clientInput.value.trim(),
    location: locationInput.value.trim(),
    device: deviceInput.value.trim(),
    barcode: decodedText
  };
  const entry = { barcode: decodedText, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}), synced:false };
  sessionScans.push(entry);
  renderScanList();

  try{
    setStatus('busy','Saving…');
    await sendRow(row);
    entry.synced = true;
    setStatus('ok','Synced');
  }catch(e){
    const q = getQueue();
    q.push(row);
    setQueue(q);
    setStatus('err', q.length + ' pending');
  }
  renderScanList();
}

let audioCtx;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 1400;
    g.gain.value = 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.08);
  }catch(e){}
}

async function startScanning(){
  if(!sessionValid()){
    validationWarn.style.display = 'block';
    return;
  }
  validationWarn.style.display = 'none';
  dateInput.disabled = true; clientInput.disabled = true; locationInput.disabled = true; deviceInput.disabled = true;
  selectExistingBtn.disabled = true;

  scanPanel.classList.add('active');
  startBtn.style.display = 'none';
  doneBtn.style.display = 'block';

  html5QrCode = new Html5Qrcode("reader");
  const config = {
    fps: 10,
    qrbox: { width: 260, height: 150 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };
  try{
    await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
    scanning = true;
  }catch(e){
    alert('Could not access the camera. Check camera permission for this site.');
    resetScanUI();
  }
}

async function stopScanning(){
  if(html5QrCode && scanning){
    try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){}
  }
  scanning = false;
  resetScanUI();
}

function resetScanUI(){
  scanPanel.classList.remove('active');
  startBtn.style.display = 'block';
  doneBtn.style.display = 'none';
  dateInput.disabled = false; clientInput.disabled = false; locationInput.disabled = false; deviceInput.disabled = false;
  selectExistingBtn.disabled = false;
}

function newEntry(){
  if(scanning) stopScanning();
  sessionScans = [];
  lastCode = null;
  dateInput.value = new Date().toISOString().slice(0,10);
  clientInput.value = '';
  locationInput.value = '';
  deviceInput.value = '';
  validationWarn.style.display = 'none';
  renderScanList();
}

startBtn.addEventListener('click', startScanning);
doneBtn.addEventListener('click', stopScanning);
newEntryBtn.addEventListener('click', newEntry);

renderScanList();
flushQueue();
</script>
</body>
</html>
